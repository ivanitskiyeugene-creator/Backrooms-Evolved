name: Build

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew build --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: backroomsevolved-jar
          path: build/libs/*.jar

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -c 200000 build.log > ci-logs/build.log
          JAR=$(find /home/runner/.gradle/caches/forge_gradle -name "*mapped_official*.jar" | head -1)
          {
            echo "JAR=$JAR"
            for C in net.minecraft.world.level.material.Material \
                     net.minecraft.client.gui.GuiGraphics \
                     com.mojang.blaze3d.platform.NativeImage \
                     net.minecraft.client.renderer.Framebuffer \
                     com.mojang.blaze3d.pipeline.Framebuffer \
                     net.minecraft.client.resources.sounds.SimpleSoundInstance \
                     net.minecraftforge.client.event.ViewportEvent \
                     net.minecraftforge.common.CreativeModeTabRegistry \
                     net.minecraft.client.Screenshot \
                     net.minecraftforge.event.TickEvent \
                     'net.minecraftforge.event.TickEvent$ClientTickEvent' \
                     'net.minecraftforge.client.event.ViewportEvent$ComputeFogColor' \
                     'net.minecraftforge.client.event.ViewportEvent$RenderFog' \
                     net.minecraft.client.renderer.GameRenderer; do
              echo "=== $C"
              javap -classpath "$JAR" "$C" 2>&1 | head -40
            done
            echo "=== ViewportEvent inner classes"
            unzip -l "$JAR" | grep -i "ViewportEvent" | head
            echo "=== BlockStateBase methods of interest"
            javap -classpath "$JAR" 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' 2>&1 | grep -iE "solid|occlude|replace|material|motion" | head -20
            echo "=== ParticleTypes fields of interest"
            javap -classpath "$JAR" net.minecraft.core.particles.ParticleTypes 2>&1 | grep -iE "COMPOSTER|FLAME|ASH|WARM" | head
            echo "=== ClientTickEvent classes"
            unzip -l "$JAR" | grep -iE "ClientTickEvent" | head
          } > ci-logs/api.txt 2>&1 || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci: build log [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
