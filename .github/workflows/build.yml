name: Build

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew build --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: backroomsevolved-jar
          path: build/libs/*.jar

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -c 200000 build.log > ci-logs/build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci: build log [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
